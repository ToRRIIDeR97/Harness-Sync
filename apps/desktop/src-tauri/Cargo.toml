[package]
name = "harness-sync"
version = "0.1.0"
description = "Harness Sync desktop application"
authors = ["Harness Sync contributors"]
edition = "2021"

[lib]
name = "harness_sync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
