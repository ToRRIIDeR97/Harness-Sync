name: Desktop builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
            artifact: windows-installer
            path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            bundle: app
            artifact: macos-app
            path: apps/desktop/src-tauri/target/release/bundle/macos/*.app
          - os: ubuntu-22.04
            bundle: appimage
            artifact: linux-appimage
            path: apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev libdbus-1-dev
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Test Rust core
        working-directory: apps/desktop/src-tauri
        run: cargo test --lib --locked
      - name: Build desktop package
        working-directory: apps/desktop
        run: npm run tauri -- build --bundles ${{ matrix.bundle }} --no-sign --ci
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
